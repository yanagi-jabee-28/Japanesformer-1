<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Japanesformer - 可逆日本語暗号化</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Noto+Sans+JP:wght@300;400;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="assets/css/style.css">
    
    <script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>
</head>
<body>

<div class="container">
    <div class="card">
        <h1>Japanesformer</h1>
        <div class="subtitle">日本語の母音を固定したまま子音のみを循環させる可逆暗号</div>

        <div class="status-container">
            <div id="status-dot" class="status-dot loading"></div>
            <div id="status-text" class="status-text">Python 環境を起動中... (約10秒かかります)</div>
        </div>

        <div class="form-group">
            <label for="input-text">入力テキスト</label>
            <textarea id="input-text" placeholder="ここに日本語テキストまたは英数字を入力してください...">きゃんでぃーちゅーん (Candy Tune) のこっちゃんが、2026年もきすみーぱてぃしえを歌う！</textarea>
        </div>

        <div class="options-row">
            <div class="option-item">
                <label for="shift-amount">シフト量 (base_shift):</label>
                <input type="number" id="shift-amount" value="1" min="0" max="100" style="width: 80px; padding: 8px 12px; border-radius: 8px;">
            </div>

            <div class="option-item">
                <label class="switch">
                    <input type="checkbox" id="wave-toggle" checked>
                    <span class="slider"></span>
                </label>
                <label for="wave-toggle">波状変換を有効にする</label>
            </div>
        </div>

        <div class="btn-group">
            <button id="btn-encrypt" class="btn-primary" disabled>
                <span>🔒 暗号化 (変換)</span>
            </button>
            <button id="btn-decrypt" class="btn-secondary" disabled>
                <span>🔓 復号化 (戻す)</span>
            </button>
        </div>

        <div class="output-container">
            <div class="output-header">
                <label>変換結果</label>
                <button id="btn-copy" class="btn-copy" style="display: none;">コピー</button>
            </div>
            <div id="output-display" class="output-text">環境の初期化をお待ちください...</div>
        </div>
    </div>
</div>

<script type="module" src="assets/js/app.js"></script>

</body>
</html>
