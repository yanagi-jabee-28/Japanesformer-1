<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Japanesformer - 可逆日本語暗号化</title>
    <!-- Google Fonts の読み込み -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Noto+Sans+JP:wght@300;400;700&display=swap" rel="stylesheet">
    
    <style>
        /* プレミアム・ダークテーマ & ガラスモーフィズムの定義 */
        :root {
            --bg-color: #0b0914;
            --card-bg: rgba(22, 18, 41, 0.65);
            --border-color: rgba(255, 255, 255, 0.08);
            --accent-primary: #8b5cf6; /* パープル */
            --accent-secondary: #06b6d4; /* シアン */
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Outfit', 'Noto Sans JP', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* 躍動的なグラデーション背景オーブ */
        body::before, body::after {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            filter: blur(120px);
            z-index: -1;
            opacity: 0.3;
            animation: float 20s infinite alternate;
        }

        body::before {
            background: var(--accent-primary);
            top: 10%;
            left: 10%;
        }

        body::after {
            background: var(--accent-secondary);
            bottom: 10%;
            right: 10%;
            animation-delay: -10s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(50px, 30px) scale(1.2); }
        }

        /* コンテナ設計 */
        .container {
            width: 100%;
            max-width: 650px;
            padding: 20px;
        }

        /* ガラスモーフィズムカード */
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
        }

        /* レインボーアウトラインのホバー効果 */
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 800;
            text-align: center;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #ffffff 30%, #a78bfa 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 0.95rem;
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 30px;
        }

        /* ステータスインジケーター（環境ロード状態） */
        .status-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 50px;
            padding: 8px 16px;
            width: fit-content;
            margin: 0 auto 24px auto;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #ef4444; /* 最初は赤（Loading） */
            box-shadow: 0 0 8px #ef4444;
            transition: all 0.3s ease;
        }

        .status-dot.loading {
            background-color: #f59e0b; /* オレンジ */
            box-shadow: 0 0 8px #f59e0b;
            animation: pulse 1.5s infinite;
        }

        .status-dot.ready {
            background-color: #10b981; /* 緑 */
            box-shadow: 0 0 8px #10b981;
        }

        @keyframes pulse {
            0% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .status-text {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        /* フォームグループ */
        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* テキストエリアと入力の装飾 */
        textarea, input[type="text"], input[type="number"] {
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            color: var(--text-main);
            padding: 16px;
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.3s ease;
            outline: none;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        textarea:focus, input[type="text"]:focus, input[type="number"]:focus {
            border-color: var(--accent-primary);
            background: rgba(255, 255, 255, 0.06);
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.15);
        }

        /* オプション行 */
        .options-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .option-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .option-item label {
            margin-bottom: 0;
        }

        /* トグルスイッチ */
        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(255, 255, 255, 0.1);
            transition: .4s;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--accent-primary);
        }

        input:checked + .slider:before {
            transform: translateX(20px);
        }

        /* ボタンデザイン */
        .btn-group {
            display: flex;
            gap: 16px;
            margin-bottom: 24px;
        }

        button {
            flex: 1;
            padding: 16px 24px;
            border-radius: 14px;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 700;
            font-family: inherit;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        button.btn-primary {
            background: linear-gradient(135deg, var(--accent-primary) 0%, #6d28d9 100%);
            color: #ffffff;
            box-shadow: 0 4px 20px rgba(139, 92, 246, 0.3);
        }

        button.btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(139, 92, 246, 0.45);
        }

        button.btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        button.btn-secondary:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--accent-secondary);
        }

        button:active:not(:disabled) {
            transform: translateY(1px);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* 出力グループ */
        .output-container {
            background: rgba(255, 255, 255, 0.02);
            border: 1px dashed rgba(255, 255, 255, 0.15);
            border-radius: 18px;
            padding: 24px;
            position: relative;
            min-height: 120px;
        }

        .output-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .output-text {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #ffffff;
            word-break: break-all;
            white-space: pre-wrap;
            font-family: 'Consolas', monospace;
        }

        .btn-copy {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            border-radius: 8px;
            padding: 6px 12px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s ease;
            width: fit-content;
            flex: none;
        }

        .btn-copy:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--accent-secondary);
        }
    </style>
    
    <!-- Pyodide の CDN 読み込み -->
    <script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>
</head>
<body>

<div class="container">
    <div class="card">
        <h1>Japanesformer</h1>
        <div class="subtitle">日本語の母音を固定したまま子音のみを循環させる可逆暗号</div>

        <!-- 初期化ステータス表示 -->
        <div class="status-container">
            <div id="status-dot" class="status-dot loading"></div>
            <div id="status-text" class="status-text">Python 環境を起動中... (約10秒かかります)</div>
        </div>

        <!-- 入力フォーム -->
        <div class="form-group">
            <label for="input-text">入力テキスト</label>
            <textarea id="input-text" placeholder="ここに日本語テキストを入力してください...">しんかんせんがはやい (漢字: 新幹線が速い)</textarea>
        </div>

        <div class="options-row">
            <!-- シフト量指定 -->
            <div class="option-item">
                <label for="shift-amount">シフト量 (base_shift):</label>
                <input type="number" id="shift-amount" value="1" min="0" max="100" style="width: 80px; padding: 8px 12px; border-radius: 8px;">
            </div>

            <!-- 波状変換トグル -->
            <div class="option-item">
                <label class="switch">
                    <input type="checkbox" id="wave-toggle" checked>
                    <span class="slider"></span>
                </label>
                <label for="wave-toggle">波状変換を有効にする</label>
            </div>
        </div>

        <!-- 実行アクションボタン -->
        <div class="btn-group">
            <button id="btn-encrypt" class="btn-primary" disabled>
                <span>🔒 暗号化 (変換)</span>
            </button>
            <button id="btn-decrypt" class="btn-secondary" disabled>
                <span>🔓 復号化 (戻す)</span>
            </button>
        </div>

        <!-- 出力表示 -->
        <div class="output-container">
            <div class="output-header">
                <label>変換結果</label>
                <button id="btn-copy" class="btn-copy" style="display: none;">コピー</button>
            </div>
            <div id="output-display" class="output-text">環境の初期化をお待ちください...</div>
        </div>
    </div>
</div>

<script>
    const statusDot = document.getElementById('status-dot');
    const statusText = document.getElementById('status-text');
    const btnEncrypt = document.getElementById('btn-encrypt');
    const btnDecrypt = document.getElementById('btn-decrypt');
    const btnCopy = document.getElementById('btn-copy');
    const inputText = document.getElementById('input-text');
    const shiftAmount = document.getElementById('shift-amount');
    const waveToggle = document.getElementById('wave-toggle');
    const outputDisplay = document.getElementById('output-display');

    let pyodideInstance = null;

    // Pyodide およびパッケージの初期化
    async function initWebAssembly() {
        try {
            console.log("Loading Pyodide...");
            pyodideInstance = await loadPyodide();
            console.log("Pyodide Loaded. Loading micropip...");
            await pyodideInstance.loadPackage("micropip");
            
            statusText.innerText = "依存パッケージ (pykakasi 等) をインストール中...";
            
            // micropip を使って pykakasi およびビルドされた japanesformer をインストール
            await pyodideInstance.runPythonAsync(`
                import micropip
                # pykakasi (Pure Python) のインストール
                await micropip.install("pykakasi")
                
                # 同一フォルダにある wheel を相対パスでインストール
                # GitHub Pages デプロイ時はルートに whl が配置されます
                await micropip.install("./japanesformer-0.1.0-py3-none-any.whl")
            `);

            statusText.innerText = "変換モジュールをコンパイル中...";
            
            // ライブラリのロードとグローバルインスタンス初期化
            await pyodideInstance.runPythonAsync(`
                from japanesformer import transform
                from japanesformer.text_utils import TextNormalizer
                normalizer = TextNormalizer()
            `);

            console.log("Initialization complete!");
            
            // UIを Ready 状態へ移行
            statusDot.className = "status-dot ready";
            statusText.innerText = "Ready - ブラウザ上で実行中";
            btnEncrypt.disabled = false;
            btnDecrypt.disabled = false;
            outputDisplay.innerText = "準備完了。入力して「暗号化」または「復号化」ボタンを押してください。";
            
        } catch (error) {
            console.error("Initialization failed:", error);
            statusDot.style.backgroundColor = "#ef4444";
            statusDot.style.boxShadow = "0 0 8px #ef4444";
            statusDot.className = "status-dot";
            statusText.innerText = "エラー: 初期化に失敗しました。";
            outputDisplay.innerText = "エラー詳細:\n" + error.message;
        }
    }

    // 暗号化・復号化の共通処理
    async function runTransformation(decrypt = false) {
        if (!pyodideInstance) return;

        const text = inputText.value;
        const shift = parseInt(shiftAmount.value) || 0;
        const useWave = waveToggle.checked;

        if (!text) {
            outputDisplay.innerText = "入力テキストが空です。";
            return;
        }

        try {
            // パラメータを Python グローバル変数にバインド
            pyodideInstance.globals.set("input_str", text);
            pyodideInstance.globals.set("shift_val", shift);
            pyodideInstance.globals.set("use_wave", useWave);
            pyodideInstance.globals.set("is_decrypt", decrypt);

            // Pythonコードの実行
            const result = await pyodideInstance.runPythonAsync(`
                # テキストの正規化とメタデータ抽出
                meta = normalizer.normalize(input_str)
                normalized_text = "".join([item["char"] for item in meta])
                
                # コア変換処理
                transformed_hira = transform(
                    normalized_text,
                    shift=shift_val,
                    decrypt=is_decrypt,
                    use_wave=use_wave
                )
                
                # 文字種（カタカナ等）の復元
                normalizer.restore_types(transformed_hira, meta)
            `);

            outputDisplay.innerText = result;
            btnCopy.style.display = "inline-block";
            btnCopy.innerText = "コピー";
        } catch (error) {
            console.error("Execution failed:", error);
            outputDisplay.innerText = "エラーが発生しました:\n" + error.message;
        }
    }

    // イベントリスナーの登録
    btnEncrypt.addEventListener('click', () => runTransformation(false));
    btnDecrypt.addEventListener('click', () => runTransformation(true));
    
    // コピーボタンの実装
    btnCopy.addEventListener('click', () => {
        const text = outputDisplay.innerText;
        navigator.clipboard.writeText(text).then(() => {
            btnCopy.innerText = "コピーしました！";
            setTimeout(() => {
                btnCopy.innerText = "コピー";
            }, 2000);
        }).catch(err => {
            console.error('Could not copy text: ', err);
        });
    });

    // ページのロード完了後に初期化開始
    window.addEventListener('load', initWebAssembly);
</script>

</body>
</html>
