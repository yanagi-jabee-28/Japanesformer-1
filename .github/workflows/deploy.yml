# GitHub Actions to build and deploy Japanesformer WebApp to GitHub Pages
name: Deploy Japanesformer WebApp

on:
  push:
    branches:
      - main  # トリガーとなるブランチ（main または master）
  workflow_dispatch:

# GitHub Pages デプロイに必要なパーミッション設定
permissions:
  contents: read
  pages: write
  id-token: write

# 同時実行の制御（古い実行をキャンセル）
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Build Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build Package (Wheel)
        run: |
          python -m build --wheel

      - name: Prepare Public Directory
        run: |
          mkdir -p public
          # index.html をコピー
          cp index.html public/
          # ビルドされた wheel ファイルをコピー
          cp dist/*.whl public/
          # 確認のためのログ出力
          ls -la public/

      - name: Setup Pages
        uses: actions/configure-pages@v4
        continue-on-error: true

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
